name: eggcellent-windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: eggcellent-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x86_64 binary
    runs-on: windows-2022
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install sccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools
        shell: pwsh
        run: glslangValidator --version

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DUSE_DISCORD_PRESENCE=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        shell: bash
        run: |
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          sccache --show-stats

      - name: Package Windows binary
        shell: pwsh
        run: |
          foreach ($exe in 'eglantine.exe', 'eden-cli.exe') {
            if (-not (Test-Path "build/release/bin/$exe")) {
              throw "build/release/bin/$exe was not produced"
            }
          }
          windeployqt --release --no-translations build/release/bin/eglantine.exe

      # GitHub downloads the uploaded directory as a ZIP containing the runnable bin folder.
      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: eggcellent-windows-x86_64-${{ github.sha }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Windows prerelease
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out license files
        uses: actions/checkout@v5

      - name: Download Windows binary
        uses: actions/download-artifact@v7
        with:
          name: eggcellent-windows-x86_64-${{ github.sha }}
          path: artifacts

      - name: Package release ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/eglantine.exe
          rm -f artifacts/*.pdb artifacts/eden-cli.exe
          cp LICENSE.txt artifacts/
          cp -R LICENSES artifacts/
          printf 'Eggcellent for Windows x64\n\nExtract all files and run eglantine.exe.\nIf Windows reports a missing Visual C++ runtime, run vc_redist.x64.exe.\nUse your own keys, firmware and games; they are not included.\nThis build is experimental.\n' > artifacts/LEIA-ME.txt
          mkdir release-output
          (cd artifacts && zip -qr ../release-output/eggcellent-windows-x86_64.zip .)
          unzip -tq release-output/eggcellent-windows-x86_64.zip
          unzip -l release-output/eggcellent-windows-x86_64.zip | tail -n 4
          ls -lh release-output/eggcellent-windows-x86_64.zip

      - name: Create prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="eggcellent-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > notes.md <<EOF
          Automatic Windows x86_64 build of \`main\` at ${GITHUB_SHA}.

          Extract the ZIP and run \`eglantine.exe\`. Supply your own keys, firmware and games. This is an experimental build.

          Triggered by @${GITHUB_ACTOR}. [Build and logs](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}).
          EOF
          release_url=$(gh release create "$tag" release-output/eggcellent-windows-x86_64.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Eggcellent Windows build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT} (${GITHUB_SHA::7})" \
            --notes-file notes.md)
          echo "Published prerelease: $release_url"
          echo "Published prerelease: $release_url" >> "$GITHUB_STEP_SUMMARY"
